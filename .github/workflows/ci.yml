name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web demo (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build (includes type checking)
        run: npm run build
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint

  python:
    name: Python (simulator + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install numpy pytest
      - name: Byte-compile all Python sources
        run: python -m py_compile sw/*.py legacy/*.py tests/*.py
      - name: Run tests
        run: python -m pytest tests/ -v

  verilog:
    name: Verilog (Icarus simulation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Compile and run every testbench
        run: |
          set -e
          mkdir -p build
          status=0
          for tb in sim/tb_*.v; do
            name=$(basename "$tb" .v)
            echo "::group::$name"
            # RTL uses SystemVerilog-2012 unpacked-array ports -> -g2012
            iverilog -g2012 -o "build/$name" "$tb" rtl/*.v
            vvp "build/$name" | tee "build/$name.log"
            if grep -Eq '\[FAIL\]|TESTS FAILED|Test Failed' "build/$name.log"; then
              echo "::error::$name reported failures"
              status=1
            elif ! grep -Eq '\[PASS\]|ALL TESTS PASSED|Test Passed' "build/$name.log"; then
              echo "::error::$name produced no PASS output"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
